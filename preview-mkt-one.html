<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Превью: Маркетинг — один дашборд v884</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
 --bg:#0F1116; --surface:#14161E; --surface2:#1A1D26; --border:rgba(255,255,255,.08); --border-f:rgba(255,255,255,.06);
 --text:#E8EAF0; --soft:#9AA3B2; --muted:#5F6674; --accent:#5E6AD2; --green:#4CB782; --red:#E5604D; --amber:#E0A458;
}
body.light{
 --bg:#F6F7FA; --surface:#FFFFFF; --surface2:#F2F3F7; --border:rgba(15,18,25,.10); --border-f:rgba(15,18,25,.07);
 --text:#16181D; --soft:#5A6072; --muted:#8A90A0;
}
body{font-family:'Inter',-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);padding:26px 30px 80px;font-size:13px}
.themeb{position:fixed;top:14px;right:16px;z-index:60;background:var(--surface);border:1px solid var(--border);color:var(--soft);border-radius:9px;padding:7px 13px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.wrap{max-width:1120px}
.tnum{font-variant-numeric:tabular-nums}

.mhead{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px}
.mhead .t{font-size:22px;font-weight:700;letter-spacing:-.3px}
.mhead .sub{font-size:11.5px;color:var(--muted);margin-top:3px}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--border-f);border-radius:9px;padding:2px}
.seg b{padding:7px 15px;font-size:12px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--soft)}
.seg b.on{background:var(--accent);color:#fff}

.sec{margin-bottom:22px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:11px}
.sec-h .n{font-size:14px;font-weight:650;letter-spacing:-.1px}
.sec-h .s{font-size:11.5px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px}

/* итог */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--border-f);border:1px solid var(--border);border-radius:14px;overflow:hidden}
@media(min-width:700px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1150px){.kpis{grid-template-columns:repeat(6,1fr)}}
.kpi{background:var(--surface);padding:15px 17px;cursor:pointer;transition:background .12s;position:relative}
.kpi:hover{background:var(--surface2)}
.kpi .l{font-size:9.5px;font-weight:700;letter-spacing:.65px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.kpi .v{font-size:22px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.kpi .h{font-size:10.5px;color:var(--muted);margin-top:4px}
.kpi:after{content:'детали';position:absolute;right:14px;top:15px;font-size:9.5px;color:var(--muted);opacity:0;transition:opacity .12s}
.kpi:hover:after{opacity:.8}

/* включение стран */
.ccf{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-8px 0 18px}
.ccf .lb{font-size:11.5px;color:var(--muted);margin-right:2px}
.ccf b{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;user-select:none}
.ccf b.off{color:var(--muted);background:transparent;border-style:dashed}
.ccf b.off .dot{opacity:.3}
.ccf .only{font-size:11.5px;color:var(--muted);background:transparent;border:0;cursor:pointer;font-family:inherit;padding:6px 4px;text-decoration:underline;text-underline-offset:3px}

/* страны */
.gc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:12px}
.gc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.gc-name{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:650}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.gc-share{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.gc-m{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:15px}
.gc-m .l{font-size:9.5px;font-weight:700;letter-spacing:.65px;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.gc-m .v{font-size:20px;font-weight:700;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.gc-m .v.dim{color:var(--muted);font-weight:600}
.fn{border-top:1px solid var(--border-f);padding-top:13px}
.fn-r{display:grid;grid-template-columns:118px 1fr 74px;align-items:center;gap:10px;margin-bottom:7px}
.fn-r:last-child{margin-bottom:0}
.fn-l{font-size:11.5px;color:var(--soft)}
.fn-b{height:7px;border-radius:4px;background:rgba(120,120,128,.13);overflow:hidden}
.fn-b i{display:block;height:100%;border-radius:4px}
.fn-v{text-align:right;font-size:12.5px;font-weight:650;font-variant-numeric:tabular-nums}
.fn-p{font-size:10.5px;color:var(--muted);font-weight:500;margin-left:5px}
.gc-foot{display:grid;grid-template-columns:1fr 1fr;gap:12px;border-top:1px solid var(--border-f);margin-top:13px;padding-top:12px}
.gc-foot .l{font-size:10.5px;color:var(--muted)}
.gc-foot .v{font-size:16px;font-weight:700;letter-spacing:-.3px;margin-top:3px;font-variant-numeric:tabular-nums}
.gc-foot .v.good{color:var(--green)}
.gc-foot .v.bad{color:var(--red)}

/* кампании */
.cmp-row{display:grid;grid-template-columns:1fr 150px 58px 74px 104px;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--border-f);cursor:pointer}
.cmp-row:last-child{border-bottom:0}
.cmp-row:hover{background:rgba(120,120,128,.05)}
.cmp-n{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:8px;min-width:0}
.cmp-n em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmp-cc{font-size:9.5px;font-weight:700;letter-spacing:.4px;color:var(--muted);border:1px solid var(--border-f);border-radius:5px;padding:2px 5px;flex:none}
.cmp-warn{font-size:9.5px;font-weight:600;color:var(--amber);border:1px solid rgba(224,164,88,.3);border-radius:5px;padding:2px 5px;flex:none}
.cmp-track{height:8px;background:rgba(120,120,128,.11);border-radius:5px;overflow:hidden}
.cmp-track i{display:block;height:100%;border-radius:5px}
.cmp-num{text-align:right;font-size:12.5px;font-weight:650;font-variant-numeric:tabular-nums}
.cmp-num.dim{color:var(--muted);font-weight:500}
.tag{font-size:10.5px;font-weight:650;border-radius:6px;padding:3px 8px;text-align:center}
.tag.good{background:rgba(76,183,130,.12);color:var(--green)}
.tag.bad{background:rgba(229,96,77,.12);color:var(--red)}
.tag.hold{background:rgba(224,164,88,.12);color:var(--amber)}
.tag.norm{background:rgba(120,120,128,.12);color:var(--soft)}
.cmp-head{display:grid;grid-template-columns:1fr 150px 58px 74px 104px;gap:12px;font-size:9.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);padding-bottom:9px;border-bottom:1px solid var(--border-f)}
.cmp-head span:nth-child(n+3){text-align:right}
.cmp-head span:last-child{text-align:center}

/* план */
.plan-r{display:grid;grid-template-columns:96px 1fr 118px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border-f)}
.plan-r:last-child{border-bottom:0}
.plan-n{font-size:12px;display:flex;align-items:center;gap:8px}
.plan-t{height:9px;background:rgba(120,120,128,.11);border-radius:5px;overflow:hidden}
.plan-t i{display:block;height:100%;border-radius:5px}
.plan-v{text-align:right;font-size:12px;font-variant-numeric:tabular-nums}
.plan-v b{font-weight:700}
.plan-v span{color:var(--muted)}

/* графики */
.chart-h{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.mseg{display:inline-flex;background:var(--surface2);border:1px solid var(--border-f);border-radius:8px;padding:2px}
.mseg b{padding:5px 11px;font-size:11.5px;border-radius:6px;cursor:pointer;font-weight:600;color:var(--soft)}
.mseg b.on{background:var(--surface);color:var(--text)}
.lg{display:flex;gap:14px;margin-top:11px;flex-wrap:wrap}
.lg span{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--soft)}
.lg i{width:16px;height:2.5px;border-radius:2px}
svg .g{stroke:rgba(120,120,128,.15);stroke-width:1}
svg .ax{fill:var(--muted);font-size:10px}
svg .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
svg circle{stroke:var(--surface);stroke-width:1.5}
svg rect.bar{rx:2}
svg line.cross{stroke:var(--soft);stroke-width:1;stroke-dasharray:3 3;opacity:.55;pointer-events:none}
svg circle.hl{stroke:var(--surface);stroke-width:2;pointer-events:none}
svg rect.hit{cursor:crosshair}
.tip{position:fixed;pointer-events:none;z-index:70;background:var(--surface2);border:1px solid var(--border);border-radius:10px;
 padding:9px 12px;font-size:12px;box-shadow:0 10px 30px rgba(0,0,0,.35);opacity:0;transition:opacity .1s;min-width:150px}
.tip .dt{font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:.3px;margin-bottom:7px}
.tip .r{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-top:4px}
.tip .r .nm{display:flex;align-items:center;gap:7px;color:var(--soft)}
.tip .r .vv{font-weight:700;font-variant-numeric:tabular-nums}
.tip .r.tot{border-top:1px solid var(--border-f);margin-top:7px;padding-top:6px}
.tip .r.tot .nm{color:var(--text)}

/* панель деталей */
.ovl{position:fixed;inset:0;background:rgba(8,9,13,.6);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .16s;z-index:40}
.ovl.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;right:0;top:0;bottom:0;width:min(660px,94vw);background:var(--bg);border-left:1px solid var(--border);z-index:50;transform:translateX(102%);transition:transform .2s cubic-bezier(.3,.8,.4,1);overflow-y:auto;padding:22px 24px 40px}
.sheet.on{transform:translateX(0)}
.sheet-h{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:18px}
.sheet-h .t{font-size:17px;font-weight:700;letter-spacing:-.3px}
.sheet-h .s{font-size:11.5px;color:var(--muted);margin-top:3px}
.xbtn{background:transparent;border:1px solid var(--border);color:var(--soft);border-radius:8px;padding:5px 11px;font-size:12px;cursor:pointer;font-family:inherit;flex:none}
table.d{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
table.d th{text-align:right;font-size:9.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--border-f)}
table.d th:first-child{text-align:left}
table.d td{text-align:right;padding:8px 10px;border-bottom:1px solid var(--border-f);font-variant-numeric:tabular-nums}
table.d td:first-child{text-align:left;color:var(--soft)}
table.d tr:last-child td{border-bottom:0}
table.d tr.tot td{font-weight:700;border-top:1px solid var(--border);border-bottom:0}
.empty{font-size:12px;color:var(--muted);padding:16px 0}
.note{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.55}
</style>
</head>

</div>

</div>

<div class="note" id="note"></div>
</div>

<div class="tip" id="tip"></div>

<div class="sheet" id="sheet"></div>

var NAMES = {KG:'Кыргызстан', KZ:'Казахстан', UZ:'Узбекистан', RU:'Россия'};
var CUR = {KG:'сом', KZ:'тг'};
var COLORS = {KG:'#5E6AD2', KZ:'#46A6C9', UZ:'#C98A46', RU:'#8A8F9C'};
var MONTHS = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
var P='month', M='spend';
// Какие страны выключены. Пустой объект — показываем все.
var HIDDEN={};

function col(c){ return COLORS[c] || '#8A8F9C'; }
function nm(c){ return NAMES[c] || c; }
function usd(n){ return n==null ? '—' : '$' + Number(n).toFixed(2); }
function usd0(n){ return n==null ? '—' : '$' + Math.round(Number(n)).toLocaleString('ru-RU'); }
function loc(n, c){ return Math.round(n).toLocaleString('ru-RU') + ' ' + (CUR[c]||''); }
function pctOf(a,b){ return (b>0 && a!=null) ? Math.round(a/b*100)+'%' : ''; }
function esc(s){ return String(s).replace(/[<>&"]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c];}); }
function periodLabel(){ return P==='week' ? 'последние 7 дней' : MONTHS[new Date().getMonth()]; }

function setP(p){ P=p; document.getElementById('sw').className=p==='week'?'on':''; document.getElementById('sm').className=p==='month'?'on':''; closeSheet(); render(); }
function allCodes(){
 var set={};
 ((SNAP[P].geo.countries)||[]).forEach(function(c){ if(c.spend>0) set[c.code]=1; });
 ((SNAP[P].daily||{}).countries||[]).forEach(function(c){ set[c]=1; });
 return Object.keys(set).sort();
}
function visCodes(){ return allCodes().filter(function(c){ return !HIDDEN[c]; }); }
function toggleC(cc){
 if(!HIDDEN[cc] && visCodes().length<=1) return; // последнюю страну не выключаем
 if(HIDDEN[cc]) delete HIDDEN[cc]; else HIDDEN[cc]=1;
 closeSheet(); render();
}
function onlyC(cc){ HIDDEN={}; allCodes().forEach(function(x){ if(x!==cc) HIDDEN[x]=1; }); closeSheet(); render(); }
function allC(){ HIDDEN={}; closeSheet(); render(); }
function renderCcf(){
 var codes=allCodes();
 var el=document.getElementById('ccf');
 if(codes.length<2){ el.innerHTML=''; return; }
 var chips=codes.map(function(cc){
  var off=!!HIDDEN[cc];
  return '<b class="'+(off?'off':'')+'" onclick="toggleC(&quot;'+cc+'&quot;)" title="'+(off?'Включить':'Выключить')+'">'
   +'<span class="dot" style="background:'+col(cc)+'"></span>'+esc(nm(cc))+'</b>';
 }).join('');
 var extra = visCodes().length===codes.length
  ? codes.map(function(cc){ return '<button class="only" onclick="onlyC(&quot;'+cc+'&quot;)">только '+esc(nm(cc))+'</button>'; }).join('')
  : '<button class="only" onclick="allC()">показать все</button>';
 el.innerHTML='<span class="lb">Страны:</span>'+chips+extra;
}

/* ── общие цифры ─────────────────────────────────────────── */
function totals(){
 var d=SNAP[P], geo=d.geo, q=d.quals;
 var list=(geo.countries||[]).filter(function(c){return c.spend>0 && !HIDDEN[c.code];});
 var spend=list.reduce(function(a,c){ return a+c.spend; },0);
 var leads=list.reduce(function(a,c){ return a+(c.leads||0); },0);
 var meet=0, inv=0, hasQ=false;
 list.forEach(function(c){
  var x=q[c.code]; if(!x) return; hasQ=true;
  meet += (x.stages&&x.stages.meeting) ? (x.stages.meeting.count||0) : 0;
  inv  += (x.stages&&x.stages.invoice) ? (x.stages.invoice.count||0) : 0;
 });
 return {spend:spend, leads:leads, cpl:leads>0?spend/leads:null, meet:hasQ?meet:null, inv:hasQ?inv:null,
         qcost:(inv>0)?spend/inv:null, list:list};
}

 ];

/* ── страны ──────────────────────────────────────────────── */
function renderGeo(t){

/* ── кампании ────────────────────────────────────────────── */
function campCountries(c){
 return Object.keys(c.by_country||{}).sort(function(a,b){ return c.by_country[b].spend - c.by_country[a].spend; });
}
function verdict(c, avgCpl){
 if(c.leads===0 && c.msgs>0) return {cls:'hold', t:c.msgs+' переписок'};
 if(c.leads===0 && c.spend>20) return {cls:'bad', t:'убрать'};
 if(c.leads===0) return {cls:'norm', t:'ждём'};
 if(avgCpl>0 && c.cpl!=null && c.cpl<=avgCpl*0.85) return {cls:'good', t:'масштабировать'};
 if(avgCpl>0 && c.cpl!=null && c.cpl>=avgCpl*1.6) return {cls:'bad', t:'дорого'};
 return {cls:'norm', t:'норма'};
}
function renderCamps(){
 var el=document.getElementById('camps');
 var list=((SNAP[P].camps||{}).campaigns||[]).map(function(c){
  // Расход и лиды кампании пересобираем только из включённых стран,
  // иначе выключенный Казахстан продолжал бы сидеть в её итогах.
  var sp=0, ld=0, ms=0, by={};
  Object.keys(c.by_country||{}).forEach(function(cc){
   if(HIDDEN[cc]) return;
   var b=c.by_country[cc]; by[cc]=b; sp+=b.spend; ld+=b.leads; ms+=(b.msgs||0);
  });
  return { id:c.id, name:c.name, spend:Math.round(sp*100)/100, leads:ld, msgs:ms,
           cpl: ld>0 ? Math.round(sp/ld*100)/100 : null, by_country:by };
 }).filter(function(c){return c.spend>0;}).sort(function(a,b){return b.spend-a.spend;});
 if(!list.length){ el.innerHTML='<div class="empty">За период не было расхода по кампаниям.</div>'; return; }
 var max=Math.max.apply(null,list.map(function(c){return c.spend;}));
 var withCpl=list.filter(function(c){return c.cpl!=null;});
 var avg=withCpl.length?withCpl.reduce(function(s,c){return s+c.cpl;},0)/withCpl.length:0;
 var head='<div class="cmp-head"><span>Кампания</span><span>Расход</span><span>Лиды</span><span>Цена лида</span><span>Вывод</span></div>';
 el.innerHTML=head+list.map(function(c){
  var ccs=campCountries(c);
  var v=verdict(c,avg);
  // Кампания названа одной страной, а показы идут в другую — это стоит увидеть.
  var named=/kg|кыргыз/i.test(c.name)?'KG':(/kz|казах|кз/i.test(c.name)?'KZ':null);
  var mismatch=(named && ccs.length && ccs[0]!==named);
  return '<div class="cmp-row" onclick="openCamp(&quot;'+c.id+'&quot;)">'
   +'<div class="cmp-n"><em>'+esc(c.name)+'</em>'
   + ccs.map(function(x){return '<span class="cmp-cc" style="color:'+col(x)+'">'+x+'</span>';}).join('')
   + (mismatch?'<span class="cmp-warn">в названии '+named+', показы в '+ccs[0]+'</span>':'')
   +'</div>'
   +'<div class="cmp-track"><i style="width:'+Math.round(c.spend/max*100)+'%;background:'+col(ccs[0]||'')+'"></i></div>'
   +'<div class="cmp-num'+(c.leads?'':' dim')+'">'+c.leads+'</div>'
   +'<div class="cmp-num'+(c.cpl!=null?'':' dim')+'">'+usd(c.cpl)+'</div>'
   +'<div class="tag '+v.cls+'">'+v.t+'</div>'
   +'</div>';
 }).join('');
}

/* ── график по дням ──────────────────────────────────────── */
function dayVal(day, cc, m){
 var b=day.by_country[cc];
 if(!b) return null;
 if(m==='spend') return b.spend;
 if(m==='leads') return b.leads;
 return b.leads>0 ? b.spend/b.leads : null;
}
var CHARTS={};
function lineChart(days, ccs, m, w, h, id){
 var W=w||1080, H=h||230, PL=46, PR=14, PT=12, PB=26;
 id = id || 'chart-main';
 if(!days.length) return '<div class="empty">Нет данных по дням.</div>';
 var all=[];
 days.forEach(function(d){ ccs.forEach(function(c){ var v=dayVal(d,c,m); if(v!=null) all.push(v); }); });
 var max=Math.max.apply(null,all.concat([1]))*1.15;
 var iw=W-PL-PR, ih=H-PT-PB;
 var X=function(i){ return PL+(days.length===1?iw/2:i/(days.length-1)*iw); };
 var Y=function(v){ return PT+ih-(v/max)*ih; };
 var fv=function(v){ return m==='leads'?String(Math.round(v)):'$'+(v>=10?v.toFixed(0):v.toFixed(1)); };
 CHARTS[id]={days:days, ccs:ccs, m:m, W:W, PL:PL, iw:iw, PT:PT, ih:ih, X:X, Y:Y};
 var s='<svg id="'+id+'" viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">';
 for(var g=0;g<=3;g++){
  var gv=max/3*g, gy=Y(gv);
  s+='<line class="g" x1="'+PL+'" y1="'+gy.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+gy.toFixed(1)+'"/>';
  s+='<text class="ax" x="'+(PL-8)+'" y="'+(gy+3.5).toFixed(1)+'" text-anchor="end">'+fv(gv)+'</text>';
 }
 var step=days.length>12?Math.ceil(days.length/9):1;
 days.forEach(function(d,i){
  if(i%step!==0 && i!==days.length-1) return;
  s+='<text class="ax" x="'+X(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+d.date.slice(8,10)+'.'+d.date.slice(5,7)+'</text>';
 });
 ccs.forEach(function(cc){
  var pts=[], segs=[];
  days.forEach(function(d,i){
   var v=dayVal(d,cc,m);
   if(v==null){ if(pts.length){segs.push(pts);pts=[];} return; }
   pts.push([X(i),Y(v),i,v]);
  });
  if(pts.length) segs.push(pts);
  segs.forEach(function(seg){
   if(seg.length>1) s+='<path class="ln" stroke="'+col(cc)+'" d="M'+seg.map(function(p){return p[0].toFixed(1)+' '+p[1].toFixed(1);}).join(' L')+'"/>';
  });
  segs.forEach(function(seg){ seg.forEach(function(p){
   s+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3" fill="'+col(cc)+'"/>';
  }); });
 });
 // Вертикаль дня и жирные точки — двигаются под курсором.
 s+='<line class="cross" x1="0" y1="'+PT+'" x2="0" y2="'+(PT+ih)+'" style="visibility:hidden"/>';
 ccs.forEach(function(cc){ s+='<circle class="hl" r="5" fill="'+col(cc)+'" style="visibility:hidden"/>'; });
 // Прозрачная зона ловит курсор по всей области графика, а не по одной точке.
 s+='<rect class="hit" x="'+PL+'" y="'+PT+'" width="'+iw+'" height="'+ih+'" fill="transparent"/>';
 return s+'</svg>';
}

// Формат значения для подсказки — зависит от выбранной метрики.
function tipVal(v, m){
 if(v==null) return '—';
 return m==='leads' ? String(Math.round(v)) : '$'+v.toFixed(2);
}

function bindChart(id){
 var g=CHARTS[id]; if(!g) return;
 var svg=document.getElementById(id); if(!svg) return;
 var hit=svg.querySelector('.hit'), cross=svg.querySelector('.cross');
 var hls=svg.querySelectorAll('.hl');
 var tip=document.getElementById('tip');
 function nearest(clientX){
  var r=svg.getBoundingClientRect();
  if(!r.width) return 0;
  var vx=(clientX-r.left)*(g.W/r.width);
  if(g.days.length===1) return 0;
  var t=(vx-g.PL)/g.iw;
  return Math.max(0, Math.min(g.days.length-1, Math.round(t*(g.days.length-1))));
 }
 function show(clientX, clientY){
  var i=nearest(clientX), day=g.days[i], x=g.X(i);
  cross.setAttribute('x1',x.toFixed(1)); cross.setAttribute('x2',x.toFixed(1));
  cross.style.visibility='visible';
  var sp=0, ld=0, rows='';
  g.ccs.forEach(function(cc,k){
   var v=dayVal(day,cc,g.m), b=day.by_country[cc];
   if(b){ sp+=b.spend; ld+=b.leads; }
   var hl=hls[k];
   if(hl){
    if(v==null){ hl.style.visibility='hidden'; }
    else { hl.setAttribute('cx',x.toFixed(1)); hl.setAttribute('cy',g.Y(v).toFixed(1)); hl.style.visibility='visible'; }
   }
   rows+='<div class="r"><span class="nm"><span class="dot" style="background:'+col(cc)+'"></span>'+esc(nm(cc))+'</span>'
    +'<span class="vv">'+tipVal(v,g.m)+'</span></div>';
  });
  if(g.ccs.length>1){
   var tot = g.m==='leads' ? ld : (g.m==='spend' ? sp : (ld>0 ? sp/ld : null));
   rows+='<div class="r tot"><span class="nm">Всего</span><span class="vv">'+tipVal(tot,g.m)+'</span></div>';
  }
  tip.innerHTML='<div class="dt">'+day.date.split('-').reverse().join('.')+'</div>'+rows;
  tip.style.opacity='1';
  var tw=tip.offsetWidth, th=tip.offsetHeight;
  var left=clientX+16, top=clientY-th-14;
  if(left+tw>window.innerWidth-10) left=clientX-tw-16;
  if(top<8) top=clientY+18;
  tip.style.left=Math.max(8,left)+'px';
  tip.style.top=top+'px';
 }
 function hide(){
  tip.style.opacity='0';
  cross.style.visibility='hidden';
  [].forEach.call(hls,function(h){ h.style.visibility='hidden'; });
 }
 hit.addEventListener('mousemove', function(e){ show(e.clientX, e.clientY); });
 hit.addEventListener('mouseleave', hide);
 hit.addEventListener('touchmove', function(e){
  if(!e.touches.length) return;
  e.preventDefault();
  show(e.touches[0].clientX, e.touches[0].clientY);
 }, {passive:false});
 hit.addEventListener('touchend', hide);
}
function drawDaily(){
 var d=SNAP[P].daily||{}, days=d.days||[], ccs=(d.countries||[]).filter(function(c){ return !HIDDEN[c]; });
 document.getElementById('chart').innerHTML=lineChart(days,ccs,M,null,null,'chart-main');

 document.getElementById('lg').innerHTML=ccs.map(function(cc){

 openSheet(titles[m], periodLabel()+' · по странам', html);
 bindChart('chart-kpi');

function openFunnel(){

 var rows=t.list.map(function(c){

 var html='<table class="d"><thead><tr><th>Страна</th><th>Лиды</th><th>В amo</th><th>Встречи</th><th>Счета</th><th>Квал стоит</th></tr></thead>'

  +(t.inv==null?'—':t.inv)+'</td><td>'+usd(t.qcost)+'</td></tr></tbody></table>'
  +'<div class="note">Встреча — этап amo «'+(stages&&stages.meeting?esc(stages.meeting.name):'Назначена встреча')
  +'», счёт — «'+(stages&&stages.invoice?esc(stages.invoice.name):'Счёт выставлен')
  +'». Лид засчитывается, даже если после этого этапа он слился.</div>';
 openSheet('Путь лида по странам', periodLabel(), html);
}

function openCamp(id){
 var d=SNAP[P];
 var c=((d.camps||{}).campaigns||[]).filter(function(x){return x.id===id;})[0];
 if(!c) return;
 var det=(d.details||{})[id]||null;
 var html='';
 if(det && det.days && det.days.length){
  var dcc=(det.countries||[]).filter(function(c){ return !HIDDEN[c]; });
  html+='<div class="card" style="margin-bottom:14px">'+lineChart(det.days, dcc, 'spend', 640, 180, 'chart-camp')
   +'<div class="lg">'+dcc.map(function(cc){return '<span><i style="background:'+col(cc)+'"></i>'+esc(nm(cc))+'</span>';}).join('')+'</div></div>';
  var rows=det.days.map(function(day){
   var sp=0, ld=0;
   dcc.forEach(function(cc){ var b=day.by_country[cc]; if(b){ sp+=b.spend; ld+=b.leads; } });
   return '<tr><td>'+day.date.split('-').reverse().join('.')+'</td><td>$'+sp.toFixed(2)+'</td><td>'+ld+'</td>'
    +'<td>'+(ld>0?'$'+(sp/ld).toFixed(2):'—')+'</td></tr>';
  }).join('');
  html+='<table class="d"><thead><tr><th>День</th><th>Расход</th><th>Лиды</th><th>Цена лида</th></tr></thead><tbody>'+rows
   +'<tr class="tot"><td>За период</td><td>'+usd(c.spend)+'</td><td>'+c.leads+'</td><td>'+usd(c.cpl)+'</td></tr></tbody></table>';
 } else {
  html+='<div class="empty">Нет разбивки по дням за период.</div>';
 }
 if(det && det.ads && det.ads.length){
  html+='<div class="sec-h" style="margin:22px 0 8px"><div class="n">Объявления</div></div>'
   +'<table class="d"><thead><tr><th>Объявление</th><th>Расход</th><th>Лиды</th><th>Цена лида</th></tr></thead><tbody>'
   + det.ads.map(function(a){
     return '<tr><td>'+esc(a.name)+'</td><td>'+usd(a.spend)+'</td><td>'+a.leads+'</td><td>'+usd(a.cpl)+'</td></tr>';
    }).join('')+'</tbody></table>';
 }
 openSheet(esc(c.name), periodLabel()+' · '+campCountries(c).map(nm).join(', '), html);
 bindChart('chart-camp');
}

document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeSheet(); });
render();
</script>
