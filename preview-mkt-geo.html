*{margin:0;padding:0;box-sizing:border-box}
:root{
 --bg:#0F1116; --surface:#14161E; --surface2:#1A1D26; --border:rgba(255,255,255,.08); --border-f:rgba(255,255,255,.06);
 --text:#E8EAF0; --soft:#9AA3B2; --muted:#5F6674; --accent:#5E6AD2; --green:#4CB782; --red:#E5604D; --amber:#E0A458;
}
body.light{
 --bg:#F6F7FA; --surface:#FFFFFF; --surface2:#F2F3F7; --border:rgba(15,18,25,.10); --border-f:rgba(15,18,25,.07);
 --text:#16181D; --soft:#5A6072; --muted:#8A90A0;
}
body{font-family:'Inter',-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);padding:26px 30px;font-size:13px}
.themeb{position:fixed;top:14px;right:16px;z-index:5;background:var(--surface);border:1px solid var(--border);color:var(--soft);border-radius:9px;padding:7px 13px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.wrap{max-width:1120px}

.mhead{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:18px}
.mhead .t{font-size:22px;font-weight:700;letter-spacing:-.3px}
.mhead .sub{font-size:11.5px;color:var(--muted);margin-top:3px}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--border-f);border-radius:9px;padding:2px}
.seg b{padding:7px 15px;font-size:12px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--soft)}
.seg b.on{background:var(--accent);color:#fff}

.geo{margin-bottom:24px}
.geo-h{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:11px}
.geo-h .n{font-size:14px;font-weight:650;letter-spacing:-.1px}
.geo-h .s{font-size:11.5px;color:var(--muted)}
.geo-warn{display:flex;gap:9px;align-items:flex-start;background:rgba(224,164,88,.07);border:1px solid rgba(224,164,88,.22);border-radius:10px;padding:10px 13px;font-size:11.5px;color:var(--soft);line-height:1.5;margin-bottom:12px}
.geo-warn b{color:var(--amber);font-weight:650}

.geo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:12px}
.gc{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px}
.gc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.gc-name{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:650}
.gc-dot{width:9px;height:9px;border-radius:50%;flex:none}
.gc-share{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.gc-m{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:15px}
.gc-m .l{font-size:9.5px;font-weight:700;letter-spacing:.65px;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.gc-m .v{font-size:20px;font-weight:700;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.gc-m .v.dim{color:var(--muted);font-weight:600}

.fn{border-top:1px solid var(--border-f);padding-top:13px}
.fn-r{display:grid;grid-template-columns:118px 1fr 74px;align-items:center;gap:10px;margin-bottom:7px}
.fn-r:last-child{margin-bottom:0}
.fn-l{font-size:11.5px;color:var(--soft)}
.fn-b{height:7px;border-radius:4px;background:rgba(120,120,128,.13);overflow:hidden}
.fn-b i{display:block;height:100%;border-radius:4px}
.fn-v{text-align:right;font-size:12.5px;font-weight:650;font-variant-numeric:tabular-nums}
.fn-p{font-size:10.5px;color:var(--muted);font-weight:500;margin-left:5px}
.gc-foot{display:flex;align-items:baseline;justify-content:space-between;border-top:1px solid var(--border-f);margin-top:13px;padding-top:12px}
.gc-foot .l{font-size:11.5px;color:var(--soft)}
.gc-foot .v{font-size:17px;font-weight:700;letter-spacing:-.3px;font-variant-numeric:tabular-nums}

.cmp{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-top:12px}
.cmp-r{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border-f)}
.cmp-r:last-child{border-bottom:0}
.cmp-l{font-size:11.5px;color:var(--soft)}
.cmp-bars{display:flex;flex-direction:column;gap:5px}
.cmp-one{display:grid;grid-template-columns:34px 1fr 84px;gap:9px;align-items:center}
.cmp-cc{font-size:10px;font-weight:700;letter-spacing:.4px;color:var(--muted)}
.cmp-track{height:9px;background:rgba(120,120,128,.11);border-radius:5px;overflow:hidden}
.cmp-track i{display:block;height:100%;border-radius:5px}
.cmp-v{text-align:right;font-size:12px;font-weight:650;font-variant-numeric:tabular-nums}
.cmp-v.best{color:var(--green)}

.dayc{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-top:12px}
.dayc-h{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.dayc-h .n{font-size:13px;font-weight:650}
.mseg{display:inline-flex;background:var(--surface2);border:1px solid var(--border-f);border-radius:8px;padding:2px}
.mseg b{padding:5px 11px;font-size:11.5px;border-radius:6px;cursor:pointer;font-weight:600;color:var(--soft)}
.mseg b.on{background:var(--surface);color:var(--text)}
.lg{display:flex;gap:14px;margin-top:11px}
.lg span{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--soft)}
.lg i{width:16px;height:2.5px;border-radius:2px}
svg .grid{stroke:rgba(120,120,128,.15);stroke-width:1}
svg .ax{fill:var(--muted);font-size:10px}
svg .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
svg .pt{stroke:var(--surface);stroke-width:1.5}
.tip{position:fixed;pointer-events:none;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 11px;font-size:11.5px;opacity:0;transition:opacity .12s;z-index:9;box-shadow:0 6px 20px rgba(0,0,0,.3);white-space:nowrap}
.note{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.55}
</style>
</head>

  w.style.display = 'flex';
  w.innerHTML = '<div><b>Кабинет ' + esc(dead[0].code) + ' не отвечает.</b> ' +
   'Токен доступа протух — цифры собраны по остальным кабинетам. ' +
   'Если в нём есть активные кампании, их расход сюда не попал.</div>';
 } else { w.style.display = 'none'; }

 document.getElementById('geo-grid').innerHTML = list.map(function(c){
  var q = quals[c.code] || null;
  var amo = q ? q.leads : null;
  var meet = q && q.stages && q.stages.meeting ? q.stages.meeting.count : null;
  var inv  = q && q.stages && q.stages.invoice ? q.stages.invoice.count : null;
  var qualCost = (inv && inv > 0) ? c.spend / inv : null;
  var base = Math.max(c.leads || 0, amo || 0, 1);
  var cc = col(c.code);
  function row(label, val, sub){
   var wd = (val==null ? 0 : val/base*100);
   return '<div class="fn-r"><div class="fn-l">' + label + '</div>' +
    '<div class="fn-b"><i style="width:' + Math.max(wd, val ? 2 : 0) + '%;background:' + cc + '"></i></div>' +
    '<div class="fn-v">' + (val==null?'—':val) + (sub?'<span class="fn-p">'+sub+'</span>':'') + '</div></div>';
  }
  return '<div class="gc">' +
   '<div class="gc-top"><div class="gc-name"><span class="gc-dot" style="background:'+cc+'"></span>' + esc(NAMES[c.code]||c.code) + '</div>' +
    '<div class="gc-share">' + (totalSpend>0 ? Math.round(c.spend/totalSpend*100) : 0) + '% расхода</div></div>' +
   '<div class="gc-m">' +
    '<div><div class="l">Расход</div><div class="v">' + usd(c.spend) + '</div></div>' +
    '<div><div class="l">Лиды</div><div class="v' + (c.leads?'':' dim') + '">' + (c.leads||0) + '</div></div>' +
    '<div><div class="l">Цена лида</div><div class="v' + (c.cpl!=null?'':' dim') + '">' + usd(c.cpl) + '</div></div>' +
   '</div>' +
   '<div class="fn">' +
    row('Лиды с рекламы', c.leads||0, '') +
    row('Попало в amo', amo, '') +
    row('Назначена встреча', meet, amo?pct(meet,amo):'') +
    row('Счёт выставлен', inv, meet?pct(inv,meet):'') +
   '</div>' +
   '<div class="gc-foot"><div class="l">Стоимость квала <span style="color:var(--muted)">расход ÷ счета</span></div>' +
    '<div class="v">' + usd(qualCost) + '</div></div>' +
  '</div>';
 }).join('');

 var metrics = [
  {k:'spend', l:'Расход', fmt:usd, less:false},
  {k:'leads', l:'Лиды с рекламы', fmt:function(v){return v==null?'—':String(v);}, less:false},
  {k:'cpl', l:'Цена лида', fmt:usd, less:true},
  {k:'qual', l:'Стоимость квала', fmt:usd, less:true}
 ];
 var vals = {};
 list.forEach(function(c){
  var q = quals[c.code] || {};
  var inv = q.stages && q.stages.invoice ? q.stages.invoice.count : null;
  vals[c.code] = { spend:c.spend, leads:c.leads||0, cpl:c.cpl, qual:(inv&&inv>0)?c.spend/inv:null };
 });
 document.getElementById('cmp').innerHTML = metrics.map(function(m){
  var nums = list.map(function(c){ return vals[c.code][m.k]; }).filter(function(v){ return v!=null && v>0; });
  var max = nums.length ? Math.max.apply(null, nums) : 0;
  var best = nums.length ? (m.less ? Math.min.apply(null, nums) : Math.max.apply(null, nums)) : null;
  var bars = list.map(function(c){
   var v = vals[c.code][m.k];
   var wd = (v!=null && max>0) ? Math.round(v/max*100) : 0;
   return '<div class="cmp-one"><div class="cmp-cc">' + c.code + '</div>' +
    '<div class="cmp-track"><i style="width:' + wd + '%;background:' + col(c.code) + '"></i></div>' +
    '<div class="cmp-v' + (v!=null && v===best && nums.length>1 ? ' best' : '') + '">' + m.fmt(v) + '</div></div>';
  }).join('');
  return '<div class="cmp-r"><div class="cmp-l">' + m.l + (m.less?' <span style="color:var(--muted)">меньше — лучше</span>':'') + '</div><div class="cmp-bars">' + bars + '</div></div>';
 }).join('');

 document.getElementById('note').innerHTML =
  'Расход и лиды — из Meta по стране аудитории. Встречи и счета — из amoCRM той же страны; лид считается дошедшим до этапа, даже если потом слился. ' +
  'В amo попадают лиды из всех источников, не только с рекламы, — поэтому «попало в amo» может быть больше, чем лидов с рекламы.';

 drawDaily();
}

function drawDaily(){
 var d = SNAP[P].daily, days = d.days || [], ccs = d.countries || [];
 var W = 1080, H = 230, PL = 46, PR = 14, PT = 12, PB = 26;
 if(!days.length){ document.getElementById('chart').innerHTML = '<div style="color:var(--muted);font-size:12px;padding:20px 0">Нет данных за период.</div>'; return; }
 function val(day, cc){
  var b = day.by_country[cc];
  if(!b) return null;
  if(M==='spend') return b.spend;
  if(M==='leads') return b.leads;
  return b.leads > 0 ? b.spend / b.leads : null;
 }
 var all = [];
 days.forEach(function(day){ ccs.forEach(function(cc){ var v = val(day,cc); if(v!=null) all.push(v); }); });
 var max = Math.max.apply(null, all.concat([1])) * 1.15;
 var iw = W - PL - PR, ih = H - PT - PB;
 var x = function(i){ return PL + (days.length===1 ? iw/2 : i/(days.length-1)*iw); };
 var y = function(v){ return PT + ih - (v/max)*ih; };
 var fmtV = function(v){ return M==='leads' ? String(Math.round(v)) : '$' + (v>=10 ? v.toFixed(0) : v.toFixed(1)); };

 var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block">';
 for(var g=0; g<=3; g++){
  var gv = max/3*g, gy = y(gv);
  s += '<line class="grid" x1="' + PL + '" y1="' + gy.toFixed(1) + '" x2="' + (W-PR) + '" y2="' + gy.toFixed(1) + '"/>';
  s += '<text class="ax" x="' + (PL-8) + '" y="' + (gy+3.5).toFixed(1) + '" text-anchor="end">' + fmtV(gv) + '</text>';
 }
 days.forEach(function(day, i){
  if(days.length > 12 && i % Math.ceil(days.length/9) !== 0 && i !== days.length-1) return;
  var lbl = day.date.slice(8,10) + '.' + day.date.slice(5,7);
  s += '<text class="ax" x="' + x(i).toFixed(1) + '" y="' + (H-8) + '" text-anchor="middle">' + lbl + '</text>';
 });
 ccs.forEach(function(cc){
  var pts = [], segs = [];
  days.forEach(function(day, i){
   var v = val(day, cc);
   if(v==null){ if(pts.length){ segs.push(pts); pts = []; } return; }
   pts.push([x(i), y(v), i, v]);
  });
  if(pts.length) segs.push(pts);
  segs.forEach(function(seg){
   if(seg.length > 1){
    s += '<path class="ln" stroke="' + col(cc) + '" d="M' + seg.map(function(p){ return p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' L') + '"/>';
   }
  });
  segs.forEach(function(seg){ seg.forEach(function(p){
   s += '<circle class="pt dpt" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="3" fill="' + col(cc) + '"' +
     ' data-t="' + esc(NAMES[cc]||cc) + ' · ' + days[p[2]].date.split('-').reverse().join('.') + ' · ' + (M==='leads' ? (p[3] + ' лид.') : '$' + p[3].toFixed(2)) + '"/>';
  }); });
 });
 s += '</svg>';
 document.getElementById('chart').innerHTML = s;
 document.getElementById('lg').innerHTML = ccs.map(function(cc){
  return '<span><i style="background:' + col(cc) + '"></i>' + esc(NAMES[cc]||cc) + '</span>';
 }).join('');

 var tip = document.getElementById('tip');
 [].forEach.call(document.querySelectorAll('.dpt'), function(el){
  el.addEventListener('mouseenter', function(){
   tip.innerHTML = el.getAttribute('data-t');
   tip.style.opacity = '1';
   var r = el.getBoundingClientRect();
   tip.style.left = (r.left + 12) + 'px'; tip.style.top = (r.top - 34) + 'px';
  });
  el.addEventListener('mouseleave', function(){ tip.style.opacity = '0'; });
 });
}
draw();
</script>
</body>
</html>
